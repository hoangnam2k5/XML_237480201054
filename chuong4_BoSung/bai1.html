<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">  
</head>
<body>
    <div id="output"></div>

    <script>
        var xmlStr = "<class><student><name>Nguyen Van A</name><age>20</age></student></class>";
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(xmlStr, "application/xml");

        var rootNode = xmlDoc.documentElement;
        var firstChild = rootNode.firstElementChild;

        var txt = "Nút gốc: " + rootNode.nodeName + "<br>" +
                  "Nút con đầu tiên: " + firstChild.nodeName;

        document.getElementById("output").innerHTML = txt;
    </script>
</body>
</html>
