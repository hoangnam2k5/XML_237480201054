<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div id="output"></div>

    <script>
        var xmlStr = "<bookstore></bookstore>";
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(xmlStr, "application/xml");

        var newBook = xmlDoc.createElement("book");

        var newTitle = xmlDoc.createElement("title");
        newTitle.textContent = "Lập trình Web";
        newBook.appendChild(newTitle);

        var newPrice = xmlDoc.createElement("price");
        newPrice.textContent = "45.00";
        newBook.appendChild(newPrice);

        xmlDoc.documentElement.appendChild(newBook);

        var serializer = new XMLSerializer();
        var xmlResult = serializer.serializeToString(xmlDoc);

        document.getElementById("output").innerText = xmlResult;
    </script>
</body>
</html>
