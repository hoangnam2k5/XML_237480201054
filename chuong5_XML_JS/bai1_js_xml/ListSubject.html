<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách môn học</title>

    <style>
        body {
           
            margin: 30px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

    </style>
</head>

<body>

    <h2>DANH SÁCH MÔN HỌC</h2>

    <table id="subjectTable">
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên môn học</th>
                <th>Nhà xuất bản</th>
                <th>Tác giả</th>
            </tr>
        </thead>

        <tbody id="subjectList">
        </tbody>
    </table>

    <script>
        // Đọc file dsmonhoc.xml
        fetch("dsmonhoc.xml")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Không thể đọc file dsmonhoc.xml");
                }
                return response.text();
            })

            // Chuyển nội dung XML thành DOM
            .then(xmlText => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(
                    xmlText,
                    "text/xml"
                );

                // Lấy tất cả các subject
                const subjects = xmlDoc.getElementsByTagName("subject");

                // Vùng hiển thị danh sách
                const subjectList =
                    document.getElementById("subjectList");

                // Duyệt từng môn học
                for (let i = 0; i < subjects.length; i++) {

                    const title =
                        subjects[i]
                            .getElementsByTagName("title")[0]
                            .textContent.trim();

                    const publisher =
                        subjects[i]
                            .getElementsByTagName("publisher")[0]
                            .textContent.trim();

                    const author =
                        subjects[i]
                            .getElementsByTagName("author")[0]
                            .textContent.trim();

                    // Tạo một dòng trong bảng
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${i + 1}</td>
                        <td>${title}</td>
                        <td>${publisher}</td>
                        <td>${author}</td>
                    `;

                    subjectList.appendChild(row);
                }
            })

            // Xử lý lỗi
            .catch(error => {
                console.error(error);

                document.getElementById("subjectList").innerHTML =
                    `<tr>
                        <td colspan="4">
                            Lỗi: ${error.message}
                        </td>
                    </tr>`;
            });
    </script>

</body>
</html>
